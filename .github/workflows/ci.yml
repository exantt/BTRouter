name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - BTRouterClient
          - BTRouterServer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36.1
            build-tools;36.1.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission on Gradle wrapper
        run: chmod +x "${{ matrix.module }}/gradlew"

      - name: Run unit tests, Android Lint, Debug & Release builds
        working-directory: ${{ matrix.module }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-reports
          path: |
            ${{ matrix.module }}/app/build/reports/
            ${{ matrix.module }}/app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-debug-apk
          path: ${{ matrix.module }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
