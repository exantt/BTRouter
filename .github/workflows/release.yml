name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching versionName (e.g. v1.1.0)'
        required: true
        type: string
      draft:
        description: 'Create release as draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APKs & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and version parity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Expected semantic version tag like v1.1.0."
            exit 1
          fi

          EXPECTED_VER="${RELEASE_TAG#v}"
          CLIENT_VER=$(grep -E '^\s*versionName\s*=' BTRouterClient/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          SERVER_VER=$(grep -E '^\s*versionName\s*=' BTRouterServer/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "Release tag: $RELEASE_TAG (expected versionName: $EXPECTED_VER)"
          echo "BTRouterClient versionName: $CLIENT_VER"
          echo "BTRouterServer versionName: $SERVER_VER"

          if [ "$CLIENT_VER" != "$EXPECTED_VER" ] || [ "$SERVER_VER" != "$EXPECTED_VER" ]; then
            echo "::error::Version mismatch! Tag expects '$EXPECTED_VER', but Client='$CLIENT_VER' and Server='$SERVER_VER'."
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "EXPECTED_VER=$EXPECTED_VER" >> "$GITHUB_ENV"

      - name: Verify signing secrets are configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASS" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PASS" ] && missing+=("ANDROID_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}. See RELEASE.md for keystore setup instructions."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/release.jks"
          if [ ! -s "${{ runner.temp }}/release.jks" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

      - name: Test, lint, build, and verify signed BTRouterClient release APK
        working-directory: BTRouterClient
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed Client APK not found at $APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "$APK"
          mkdir -p ../dist
          cp "$APK" "../dist/BTRouterClient-${RELEASE_TAG}.apk"

      - name: Test, lint, build, and verify signed BTRouterServer release APK
        working-directory: BTRouterServer
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed Server APK not found at $APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "$APK"
          mkdir -p ../dist
          cp "$APK" "../dist/BTRouterServer-${RELEASE_TAG}.apk"

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Generate SHA-256 checksums and extract release notes
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum "BTRouterClient-${RELEASE_TAG}.apk" "BTRouterServer-${RELEASE_TAG}.apk" > SHA256SUMS.txt)

          if [ -f CHANGELOG.md ]; then
            awk -v ver="$EXPECTED_VER" '
              $0 ~ "^## \\[" ver "\\]" { in_sec=1; print; next }
              in_sec && /^## \[/ { exit }
              in_sec { print }
            ' CHANGELOG.md > dist/release_notes.md
          fi

          if [ ! -s dist/release_notes.md ]; then
            echo "Release ${RELEASE_TAG}" > dist/release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BTRouter ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
          body_path: dist/release_notes.md
          generate_release_notes: true
          files: |
            dist/BTRouterClient-${{ env.RELEASE_TAG }}.apk
            dist/BTRouterServer-${{ env.RELEASE_TAG }}.apk
            dist/SHA256SUMS.txt
